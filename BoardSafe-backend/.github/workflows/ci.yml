name: BoardSafe CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q app
      - name: Test domain and API
        run: pytest --cov=app --cov-report=term-missing
      - name: Check SQLite migration chain
        run: |
          BOARDSAFE_DATABASE_URL=sqlite:///./ci-check.sqlite alembic upgrade head
          BOARDSAFE_DATABASE_URL=sqlite:///./ci-check.sqlite alembic current
      - name: Export OpenAPI
        run: python scripts/export_openapi.py
