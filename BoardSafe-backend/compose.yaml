name: boardsafe
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardsafe
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      POSTGRES_DB: boardsafe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardsafe -d boardsafe"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    restart: "no"

  api:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.workers", "--interval", "60"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [internal]

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: ["osrm-routed", "--algorithm", "mld", "/data/peru-latest.osrm"]
    volumes:
      - ./data/osrm:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    profiles: [routing]
    restart: unless-stopped
    networks: [internal]

networks:
  internal: {}
volumes:
  pgdata: {}
