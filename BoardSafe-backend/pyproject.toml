[project]
name = "boardsafe-backend"
version = "1.0.0"
description = "BoardSafe – Accessible mobility continuity and resilient transport backend (WFEO challenges 1, 3 and 4)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "httpx>=0.27,<1", "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<26", "shapely>=2.0,<3", "python-multipart>=0.0.9,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.7,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 110
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
