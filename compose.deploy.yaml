name: boardsafe

x-runtime-environment: &runtime-environment
  BOARDSAFE_ENVIRONMENT: production
  BOARDSAFE_DATABASE_URL: postgresql+psycopg://boardsafe_app:${DB_APP_PASSWORD:?Configure DB_APP_PASSWORD}@postgres:5432/boardsafe
  BOARDSAFE_JWT_SECRET: ${BOARDSAFE_JWT_SECRET:?Configure BOARDSAFE_JWT_SECRET}
  BOARDSAFE_INGEST_TOKEN: ${BOARDSAFE_INGEST_TOKEN:?Configure BOARDSAFE_INGEST_TOKEN}
  BOARDSAFE_CORS_ORIGINS: ${BOARDSAFE_CORS_ORIGINS:?Configure BOARDSAFE_CORS_ORIGINS}
  BOARDSAFE_OSRM_BASE_URL: ${BOARDSAFE_OSRM_BASE_URL:-http://osrm:5000}
  BOARDSAFE_PUBLIC_OSRM_ALLOWED: "false"
  BOARDSAFE_OPEN_METEO_ENABLED: ${BOARDSAFE_OPEN_METEO_ENABLED:-false}

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardsafe_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      POSTGRES_DB: boardsafe
      BOARDSAFE_APP_DB_PASSWORD: ${DB_APP_PASSWORD:?Configure DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/20-application-role.sql:/docker-entrypoint-initdb.d/20-application-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U boardsafe_owner -d boardsafe"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [private]

  migrate:
    build: ./BoardSafe-backend
    command: ["python", "-m", "app.cli", "migrate"]
    environment:
      <<: *runtime-environment
      BOARDSAFE_BOOTSTRAP_ADMIN_EMAIL: ${BOARDSAFE_BOOTSTRAP_ADMIN_EMAIL:-}
      BOARDSAFE_BOOTSTRAP_ADMIN_PASSWORD: ${BOARDSAFE_BOOTSTRAP_ADMIN_PASSWORD:-}
      BOARDSAFE_DATABASE_URL: postgresql+psycopg://boardsafe_owner:${DB_PASSWORD:?Configure DB_PASSWORD}@postgres:5432/boardsafe
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [private]

  api:
    build: ./BoardSafe-backend
    environment: *runtime-environment
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [private]

  worker:
    build: ./BoardSafe-backend
    environment: *runtime-environment
    command: ["python", "-m", "app.workers", "--interval", "60"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [private]

  frontend:
    environment:
      BOARDSAFE_INTERNAL_API_URL: http://api:8000/api/v1
      BOARDSAFE_KIOSK_NODE_ID: ${BOARDSAFE_KIOSK_NODE_ID:-}
      BOARDSAFE_KIOSK_NODE_KEY: ${BOARDSAFE_KIOSK_NODE_KEY:-}
    build:
      context: ./boardsafe-frontend
      args:
        NEXT_PUBLIC_BOARDSAFE_API_URL: /api/v1
        NEXT_PUBLIC_BOARDSAFE_WS_URL: /api/v1/ws/events
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    networks: [private]

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${BOARDSAFE_BIND_ADDRESS:-127.0.0.1}:${BOARDSAFE_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
    depends_on:
      frontend: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [private]

  osrm:
    image: ${BOARDSAFE_OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:latest}
    command: ["osrm-routed", "--algorithm", "mld", "/data/peru-latest.osrm"]
    volumes:
      - ./BoardSafe-backend/data/osrm:/data:ro
    profiles: [routing]
    restart: unless-stopped
    networks: [private]

networks:
  private: {}
volumes:
  pgdata: {}
