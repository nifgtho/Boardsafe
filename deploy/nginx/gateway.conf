map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $boardsafe_proto { default $scheme; https https; }
limit_req_zone $binary_remote_addr zone=boardsafe_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=boardsafe_kiosk_create:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=boardsafe_kiosk_track:10m rate=60r/m;
# This gateway is published on loopback only, behind the host TLS proxy.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /api/v1/auth/login {
        limit_req zone=boardsafe_auth burst=10 nodelay;
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://api:8000;
    }
    location = /api/v1/auth/register {
        limit_req zone=boardsafe_auth burst=5 nodelay;
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://api:8000;
    }
    location = /api/kiosk/requests {
        limit_req zone=boardsafe_kiosk_create burst=3 nodelay;
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://frontend:3000;
    }
    location ~ ^/api/kiosk/(tracking|complete)$ {
        limit_req zone=boardsafe_kiosk_track burst=10 nodelay;
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://frontend:3000;
    }
    location = /api/v1/ws/events {
        include /etc/nginx/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://api:8000;
    }
    location /api/v1/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://api:8000;
    }
    location = /health/ready {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://api:8000;
    }
    location ~ /\. { return 404; }
    location / {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://frontend:3000;
    }
}
